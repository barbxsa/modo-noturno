<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --ceu: #10142b;
    --ceu-claro: #1c2145;
    --lua: #f5e9c8;
    --texto: #e8eaf6;
    --texto-suave: #8b91b8;
    --trilho: #2c3260;
    --acento: #f5e9c8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 300px;
    background: linear-gradient(180deg, var(--ceu) 0%, #0a0d1f 100%);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 13px;
    user-select: none;
  }

  /* ---------- Cabeçalho com lua-interruptor ---------- */
  header {
    padding: 22px 20px 16px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .estrelas {
    position: absolute; inset: 0; pointer-events: none;
    opacity: .7; transition: opacity .4s;
  }
  body.desligado .estrelas { opacity: .15; }
  .estrelas i {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: var(--lua); animation: piscar 3s infinite ease-in-out;
  }
  .estrelas i:nth-child(1){top:18%;left:14%;animation-delay:.2s}
  .estrelas i:nth-child(2){top:34%;left:82%;animation-delay:1.1s}
  .estrelas i:nth-child(3){top:64%;left:22%;animation-delay:2s}
  .estrelas i:nth-child(4){top:12%;left:58%;animation-delay:.7s}
  .estrelas i:nth-child(5){top:52%;left:70%;animation-delay:1.6s}
  @keyframes piscar { 0%,100%{opacity:.2} 50%{opacity:1} }
  @media (prefers-reduced-motion: reduce) {
    .estrelas i { animation: none; opacity: .6; }
  }

  #lua {
    width: 64px; height: 64px; border-radius: 50%;
    border: none; cursor: pointer; position: relative;
    background: var(--lua);
    box-shadow:
      inset -12px -8px 0 0 #d9c99a,
      0 0 28px 4px rgba(245, 233, 200, .35);
    transition: transform .25s, box-shadow .4s, background .4s;
  }
  #lua:hover { transform: scale(1.06); }
  #lua:focus-visible { outline: 2px solid var(--lua); outline-offset: 4px; }
  body.desligado #lua {
    background: #3a3f66;
    box-shadow: inset -12px -8px 0 0 #2c3157;
  }

  h1 { font-size: 15px; font-weight: 600; margin-top: 12px; letter-spacing: .3px; }
  #estado { color: var(--texto-suave); font-size: 12px; margin-top: 2px; }

  /* ---------- Seções ---------- */
  section { padding: 14px 20px; border-top: 1px solid var(--trilho); }

  .linha {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
  }
  .linha + .linha { margin-top: 12px; }

  .rotulo { color: var(--texto); }
  .sub { display: block; color: var(--texto-suave); font-size: 11px; margin-top: 1px; }

  /* ---------- Toggle por site ---------- */
  .chave {
    position: relative; width: 40px; height: 22px; flex-shrink: 0;
  }
  .chave input { opacity: 0; width: 100%; height: 100%; position: absolute; cursor: pointer; margin: 0; }
  .chave span {
    position: absolute; inset: 0; border-radius: 22px;
    background: var(--trilho); transition: background .2s;
  }
  .chave span::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--texto-suave); transition: transform .2s, background .2s;
  }
  .chave input:checked + span { background: var(--lua); }
  .chave input:checked + span::after { transform: translateX(18px); background: var(--ceu); }
  .chave input:focus-visible + span { outline: 2px solid var(--lua); outline-offset: 2px; }

  /* ---------- Sliders ---------- */
  .ajuste { margin-top: 14px; }
  .ajuste:first-child { margin-top: 0; }
  .ajuste .topo {
    display: flex; justify-content: space-between; margin-bottom: 6px;
    color: var(--texto-suave); font-size: 12px;
  }
  .ajuste .topo b { color: var(--texto); font-weight: 500; }

  input[type="range"] {
    -webkit-appearance: none; width: 100%; height: 4px;
    background: var(--trilho); border-radius: 4px; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: var(--lua);
    box-shadow: 0 0 6px rgba(245,233,200,.5);
  }
  input[type="range"]:focus-visible { outline: 2px solid var(--lua); outline-offset: 4px; }

  #redefinir {
    margin-top: 14px; width: 100%; padding: 8px;
    background: transparent; border: 1px solid var(--trilho);
    border-radius: 8px; color: var(--texto-suave);
    font-size: 12px; cursor: pointer; transition: border-color .2s, color .2s;
  }
  #redefinir:hover { border-color: var(--lua); color: var(--texto); }

  #aviso {
    padding: 10px 20px 14px; color: var(--texto-suave);
    font-size: 11px; text-align: center; display: none;
  }
  #aviso.visivel { display: block; }
</style>
</head>
<body>

<header>
  <div class="estrelas"><i></i><i></i><i></i><i></i><i></i></div>
  <button id="lua" aria-label="Ativar ou desativar o modo noturno"></button>
  <h1>Modo Noturno Universal</h1>
  <p id="estado">Ativo</p>
</header>

<section>
  <div class="linha">
    <div>
      <span class="rotulo">Ativar em todos os sites</span>
      <span class="sub">Interruptor geral da extensão</span>
    </div>
    <label class="chave">
      <input type="checkbox" id="chaveGlobal">
      <span></span>
    </label>
  </div>
</section>

<section>
  <div class="linha">
    <div>
      <span class="rotulo">Ativar neste site</span>
      <span class="sub" id="dominio">carregando…</span>
    </div>
    <label class="chave">
      <input type="checkbox" id="chaveSite" checked>
      <span></span>
    </label>
  </div>
</section>

<section>
  <div class="ajuste">
    <div class="topo"><span>Brilho</span><b id="valorBrilho">100%</b></div>
    <input type="range" id="brilho" min="50" max="150" value="100" aria-label="Brilho">
  </div>
  <div class="ajuste">
    <div class="topo"><span>Contraste</span><b id="valorContraste">100%</b></div>
    <input type="range" id="contraste" min="50" max="150" value="100" aria-label="Contraste">
  </div>
  <div class="ajuste">
    <div class="topo"><span>Sépia</span><b id="valorSepia">0%</b></div>
    <input type="range" id="sepia" min="0" max="100" value="0" aria-label="Sépia">
  </div>
  <button id="redefinir">Redefinir ajustes</button>
</section>

<p id="aviso">Este site já usa tema escuro — o filtro foi dispensado aqui.</p>

<script src="popup.js"></script>
</body>
</html>
